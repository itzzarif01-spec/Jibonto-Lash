<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>জীবন্ত লাশ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%;
    background: radial-gradient(ellipse at 50% 30%, #1a1610 0%, #0a0806 55%, #000 100%);
    overflow:hidden;
    font-family: 'Hind Siliguri', sans-serif;
  }

  #smoke {
    position:fixed; inset:0;
    z-index:0;
    pointer-events:none;
  }

  .wisp {
    position:absolute;
    bottom:-20%;
    width:220px; height:340px;
    background: radial-gradient(ellipse at center, rgba(120,110,95,0.10) 0%, rgba(80,75,65,0.04) 45%, transparent 70%);
    border-radius:50%;
    filter: blur(10px);
    animation: rise linear infinite;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(0.8); opacity:0; }
    10% { opacity:0.7; }
    80% { opacity:0.3; }
    100% { transform: translateY(-120vh) translateX(40px) scale(1.4); opacity:0; }
  }

  .ember {
    position:absolute;
    width:2px; height:2px;
    border-radius:50%;
    background:#c96a3a;
    box-shadow: 0 0 4px 1px rgba(201,106,58,0.6);
    opacity:0;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0% { transform: translateY(0) translateX(0); opacity:0; }
    8% { opacity:0.8; }
    60% { opacity:0.4; }
    100% { transform: translateY(-90vh) translateX(-30px); opacity:0; }
  }

  #container {
    position:relative;
    z-index:2;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }

  #playBtn {
    width:92px; height:92px;
    border-radius:50%;
    border: 1px solid rgba(200,170,140,0.2);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(6px);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all .5s ease;
    box-shadow: 0 0 40px rgba(150,90,50,0.12);
    position:relative;
  }

  #playBtn:hover {
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 60px rgba(180,110,60,0.25);
    transform: scale(1.05);
  }

  #playBtn::after {
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:1px solid rgba(180,120,70,0.12);
    animation: pulse 2.8s ease-out infinite;
  }

  @keyframes pulse {
    0% { transform:scale(0.9); opacity:0.5; }
    100% { transform:scale(1.5); opacity:0; }
  }

  #playBtn svg { fill:#e8ddd0; opacity:0.85; margin-left:5px; }

  #hint {
    margin-top:26px;
    color:rgba(200,190,175,0.32);
    font-size:14px;
    letter-spacing:1px;
    font-weight:300;
    text-align:center;
  }

  #author {
    margin-top:10px;
    color:rgba(200,190,175,0.22);
    font-size:12px;
    letter-spacing:2px;
    font-weight:300;
    text-align:center;
  }

  #titleShow {
    position:absolute;
    top:14%;
    color:rgba(220,200,180,0.5);
    font-size:15px;
    letter-spacing:4px;
    font-weight:300;
    opacity:0;
    transition: opacity 2s ease;
  }

  #stage {
    position:relative;
    z-index:2;
    height:100vh;
    width:100vw;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 0 8vw;
    text-align:center;
  }

  .line {
    font-size:clamp(19px, 3vw, 34px);
    font-weight:400;
    color:rgba(230,222,210,0.9);
    opacity:0;
    line-height:1.85;
    letter-spacing:0.3px;
    text-shadow: 0 0 20px rgba(150,110,70,0.25), 0 0 2px rgba(255,255,255,0.3);
    filter: blur(6px);
    transform: translateY(18px) scale(0.98);
    position:absolute;
    max-width: 880px;
  }

  .line.heavy {
    color:rgba(210,160,140,0.9);
    text-shadow: 0 0 22px rgba(180,80,60,0.28), 0 0 2px rgba(255,255,255,0.3);
  }

  .line.stanza-title {
    font-size:clamp(14px, 1.8vw, 18px);
    letter-spacing:3px;
    color:rgba(190,170,150,0.5);
    font-weight:300;
  }

  .line.show {
    animation: lineIn 2.4s cubic-bezier(.19,1,.22,1) forwards, lineOut 2.4s ease-in forwards;
    animation-delay: 0s, var(--hold);
  }

  @keyframes lineIn {
    0% { opacity:0; filter:blur(10px); transform: translateY(24px) scale(0.97); }
    35% { opacity:1; filter:blur(0px); transform: translateY(0) scale(1); }
    100% { opacity:1; filter:blur(0px); transform: translateY(0) scale(1); }
  }

  @keyframes lineOut {
    0% { opacity:1; filter:blur(0px); transform: translateY(0) scale(1); }
    100% { opacity:0; filter:blur(8px); transform: translateY(-18px) scale(1.01); }
  }

  #progress {
    position:fixed;
    bottom:0; left:0;
    height:2px;
    background: linear-gradient(90deg, rgba(180,110,60,0.6), rgba(210,160,140,0.6));
    width:0%;
    z-index:3;
    transition: width 0.3s linear;
  }

  #endNote {
    position:absolute;
    opacity:0;
    color:rgba(200,180,160,0.4);
    font-size:15px;
    letter-spacing:2px;
    font-weight:300;
    transition: opacity 2.5s ease;
  }

  #restartBtn {
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 26px;
    border-radius:30px;
    border:1px solid rgba(200,170,140,0.18);
    background:rgba(255,255,255,0.03);
    color:rgba(220,205,185,0.65);
    font-family:'Hind Siliguri',sans-serif;
    font-size:14px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
    z-index:5;
    backdrop-filter: blur(6px);
  }
  #restartBtn.show { opacity:1; pointer-events:auto; }
  #restartBtn:hover { background:rgba(255,255,255,0.08); }
</style>
</head>
<body>

<div id="smoke"></div>
<div id="progress"></div>
<div id="titleShow">জীবন্ত লাশ</div>

<div id="container">
  <div id="playBtn" onclick="startPlayback()">
    <svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div id="hint">জীবন্ত লাশ</div>
  <div id="author">সাইমুল হক জারিফ</div>
</div>

<div id="stage"></div>
<button id="restartBtn" onclick="location.reload()">আবার পড়ো</button>

<script>
// ---------- Smoke wisps ----------
const smokeLayer = document.getElementById('smoke');
for (let i=0;i<10;i++){
  const w = document.createElement('div');
  w.className='wisp';
  w.style.left = (Math.random()*100)+'%';
  w.style.animationDuration = (14+Math.random()*10)+'s';
  w.style.animationDelay = (Math.random()*14)+'s';
  smokeLayer.appendChild(w);
}
for (let i=0;i<40;i++){
  const e = document.createElement('div');
  e.className='ember';
  e.style.left = (Math.random()*100)+'%';
  e.style.bottom = (Math.random()*20)+'%';
  e.style.animationDuration = (8+Math.random()*6)+'s';
  e.style.animationDelay = (Math.random()*10)+'s';
  smokeLayer.appendChild(e);
}

// ---------- Lyrics/poem data: [text, holdSeconds, mood] ----------
const lyrics = [
  ["সবাই বলে, \"সেখানে যাও, যেখানে প্রেম থাকে,\"", 4.4],
  ["অথচ এই শূন্য হৃদয় কে আর বুকে রাখে!", 4.4, "heavy"],
  ["ভালোবাসা? সে তো কেবল বিলাসী কল্পনা,", 4.0],
  ["সবার চোখে আমি শুধুই বিরক্তি, যাতনা।", 4.6, "heavy"],

  ["বুকের ভেতর ভাঙছে কিছু, জমছে কালো মেঘ,", 4.2],
  ["বোঝার মতো কেউ তো নেই, মনের এই আবেগ।", 4.4],
  ["কষ্টগুলো যখন এসে গলা চেপে ধরে,", 4.0, "heavy"],
  ["দশের টাকার ধোঁয়ায় কেবল দীর্ঘশ্বাস ওড়ে।", 4.8, "heavy"],

  ["মন খারাপের অমানিশায় কেউ আসে না কাছে,", 4.4],
  ["শ্বাস নিচ্ছি ঠিকই, তবে একটা লাশই বাঁচে।", 4.8, "heavy"],
  ["বুকের ভেতর জমতে থাকে পাহাড়সম ক্ষত,", 4.2],
  ["আমিও তো মানুষ ছিলাম, এখন আমি মৃত।", 5.2, "heavy"],

  ["ইচ্ছে করে ডুকরে কাঁদি, আকাশ ফাটাই সুরে,", 4.4],
  ["হয়তো তাতে বুকের পাথর একটু যেত দূরে!", 4.6],
  ["কিন্তু আমি ভাগ্যাহত, এমনই এক জন", 4.0, "heavy"],
  ["কাঁদতে গিয়েও পাথর হয়ে থমকে থাকে মন।", 5.0, "heavy"],

  ["নীরবতায় গুমরে মরি, কেউ শোনে না ডাক,", 4.6, "heavy"],
  ["অশ্রুবিহীন এই যে জীবন, ধোঁয়ায় পুড়ে যাক।", 5.6, "heavy"],
];

const GAP = 0.6;

function startPlayback(){
  document.getElementById('container').style.display = 'none';
  document.getElementById('titleShow').style.opacity = 1;
  const stage = document.getElementById('stage');
  stage.style.display = 'flex';

  let t = 0.3;
  lyrics.forEach((item) => {
    const [text, hold, mood] = item;
    const div = document.createElement('div');
    div.className = 'line' + (mood === 'heavy' ? ' heavy' : '');
    div.textContent = text;
    div.style.setProperty('--hold', hold + 's');
    stage.appendChild(div);

    setTimeout(()=>{
      div.classList.add('show');
    }, t*1000);

    t += hold + GAP;
  });

  const progress = document.getElementById('progress');
  const startTime = Date.now();
  const totalMs = t*1000;
  const interval = setInterval(()=>{
    const elapsed = Date.now()-startTime;
    const pct = Math.min(100, (elapsed/totalMs)*100);
    progress.style.width = pct+'%';
    if (pct>=100) clearInterval(interval);
  }, 100);

  setTimeout(()=>{
    const note = document.createElement('div');
    note.id='endNote';
    note.textContent = '— জীবন্ত লাশ । সাইমুল হক জারিফ —';
    stage.appendChild(note);
    requestAnimationFrame(()=> note.style.opacity = 1);

    document.getElementById('restartBtn').classList.add('show');
  }, t*1000 + 400);
}
</script>

</body>
</html>
